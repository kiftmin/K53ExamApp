services:
  app:
    build: .
    container_name: k53exam
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # Persist admin-uploaded sign images across rebuilds (DB stores /assets/signs/... URLs)
      - ./sign-assets:/app/dist/public/assets/signs
